<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#091923" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="神話大戦" />
    <link rel="manifest" href="./manifest.webmanifest?v=mythology-1" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=mythology-1" />
    <meta name="description" content="神話大戦 — ユーラシア・アフリカの覇権。剣と魔法のユーラシアとアフリカを舞台にしたリアルタイムストラテジー（ブラウザ版）" />
    <title>神話大戦 — ユーラシア・アフリカの覇権</title>
    <link rel="icon" href="./favicon.ico?v=mythology-1" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #091923; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      body { touch-action: none; }
      /* 画面の縁からの余白（指で操作する端末では、ノッチ・ホームバー・戻るジェスチャーの領域を避ける） */
      :root { --sl: 0px; --sr: 0px; --st: 0px; --sb: 0px; --recovery-space: 44px; }
      :root.touch { --sl: max(env(safe-area-inset-left), 14px); --sr: max(env(safe-area-inset-right), 14px);
          --st: max(env(safe-area-inset-top), 10px); --sb: max(env(safe-area-inset-bottom), 14px); }
      canvas { position: fixed; left: var(--sl); top: var(--st); display: block;
        width: calc(100vw - var(--sl) - var(--sr)); height: calc(100vh - var(--st) - var(--sb) - var(--recovery-space)); height: calc(100dvh - var(--st) - var(--sb) - var(--recovery-space)); }
      #ui { touch-action: none; outline: none; }
      :root.touch.recovery-playing { --recovery-space: 0px; }
      :root.touch.recovery-playing #browser-recovery { display: none; }
      /* スマートフォンを縦に持っているときは横向きを促す */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: rgba(9, 25, 35, 0.96); color: #eee8d6; font: 18px "Noto Sans JP", sans-serif; text-align: center; padding: 24px; }
      #rotate .phone { width: 44px; height: 76px; border: 3px solid #c8b687; border-radius: 8px; animation: rot 2.4s ease-in-out infinite; }
      @keyframes rot { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
      /* 縦持ちでは文字が小さくなりすぎるので、横向きを促す（スマートフォン・タブレットとも） */
      @media (orientation: portrait) { :root.touch #rotate { display: flex; } }
      #loading { position: fixed; inset: 0; box-sizing: border-box; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        padding: max(12vh, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        color: #fff0cf; font: 18px "Yu Gothic UI", "Noto Sans JP", sans-serif;
        background: linear-gradient(180deg, rgba(7, 17, 29, 0.12), rgba(7, 17, 29, 0.62) 52%, rgba(7, 17, 29, 0.92)),
          #091923 url("./key-art.jpg?v=mythology-1") center / cover no-repeat;
        gap: clamp(6px, 2vh, 18px); text-shadow: 0 2px 8px #050c16; }
      #loading h1 { margin: 0; font-family: Georgia, "Yu Mincho", serif; font-size: clamp(30px, 7vw, 72px);
        letter-spacing: 0.14em; color: #ffe1a0; }
      #loading .subtitle { margin: 0; font-size: clamp(13px, 2.7vw, 19px); }
      #loading-msg { font-size: clamp(13px, 2.5vw, 17px); }
      #loading.hidden { display: none; }
      #loading .err { color: #ff8a7a; max-width: 80vw; white-space: pre-wrap; font-size: 14px; }
    </style>
  </head>
  <body data-game-wasm="yymythology.wasm">
    <canvas id="gl"></canvas>
    <canvas id="ui" tabindex="0"></canvas>
    <div id="rotate"><div class="phone"></div><div id="rotate-msg">画面を横向きにしてお遊びください</div></div>
    <div id="loading">
      <h1>神話大戦</h1>
      <p class="subtitle">ユーラシア・アフリカの覇権</p>
      <div id="loading-msg" role="status">読み込み中…</div>
    </div>
    <script src="./browser-recovery.js"></script>
    <script type="module">
      const url = new URL('./main.js', location.href);
      const refresh = new URL(location.href).searchParams.get('_yyrefresh');
      if (refresh) url.searchParams.set('_yyrefresh', refresh);
      import(url.href).catch((error) => {
        console.error(error);
        const message = document.getElementById('loading-msg');
        if (message) message.textContent = '読み込みに失敗しました / Loading failed / 加载失败: ' + error.message;
      });
    </script>
  </body>
</html>
